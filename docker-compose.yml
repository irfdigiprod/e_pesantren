version: "3.8"

services:
  # Database Service
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-pesantren}
      MYSQL_USER: ${DB_USER:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network

  # Backend Service
  backend:
    build: ./backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: mysql://${DB_USER:-root}:${DB_PASSWORD:-password}@db:3306/${DB_NAME:-pesantren}
      JWT_SECRET: ${JWT_SECRET:-rahasia_negara_api}
      CORS_ORIGINS: "*"
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@minhajulhaq.com}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - db
    networks:
      - app_network

  # Frontend Service
  frontend:
    build: ./frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
